# claudes-glassy - Hypridle
# Doku: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Sperren macht der Quickshell-Sperrbildschirm (Fallback: hyprlock).
# Kein automatisches Standby (der PC laeuft auch als Server).

$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'; hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
    inhibit_sleep = 3
}

# 10 min: sperren
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 12 min: Bildschirme aus
listener {
    timeout = 720
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
