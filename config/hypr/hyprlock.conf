# ==================================================================
#  claudes-glassy - Hyprlock (Sperrbildschirm)
#  hyprlock nutzt hyprlang-Syntax (nicht Lua wie Hyprland).
#  Doku: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
#  Layout (Hauptmonitor):
#           Samstag, 24. Oktober
#                  18
#                  57          <- grosse Uhr, Minuten in Mauve
#        +---------------------------+
#        |        ( Avatar )         |  <- Glas-Karte
#        |   Guten Abend, Stefan     |
#        |   [ Passwort ........ ]   |
#        +---------------------------+
#   Layout: de          Musik: Titel - Kuenstler        Enter = entsperren
# ==================================================================

$mon    = DP-3
$font   = Inter
$heavy  = Inter ExtraBold
$text   = rgb(cdd6f4)
$sub    = rgba(a6adc8ee)
$mauve  = rgb(cba6f7)
$pink   = rgb(f5c2e7)
$red    = rgb(f38ba8)
$green  = rgb(a6e3a1)

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 2
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 5, smooth
    animation = inputFieldDots, 1, 2, smooth
}

# ---------- Hintergrund: aktuelles Wallpaper, stark verschwommen ----------
background {
    monitor =
    path = ~/.cache/claudes-glassy/wallpaper
    color = rgb(11111b)            # Fallback, falls kein Wallpaper gesetzt ist
    blur_passes = 3
    blur_size = 10
    noise = 0.015
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.25
    vibrancy_darkness = 0.1
}

# ---------- Datum ----------
label {
    monitor = $mon
    text = cmd[update:60000] LC_TIME=de_AT.UTF-8 date +"%A, %d. %B"
    color = $sub
    font_size = 22
    font_family = $font Medium
    position = 0, 390
    halign = center
    valign = center
}

# ---------- Uhr: Stunden ----------
label {
    monitor = $mon
    text = cmd[update:1000] date +"%H"
    color = rgba(cdd6f4f0)
    font_size = 170
    font_family = $heavy
    position = 0, 250
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0,0,0,0.35)
}

# ---------- Uhr: Minuten (Mauve) ----------
label {
    monitor = $mon
    text = cmd[update:1000] date +"%M"
    color = rgba(cba6f7f0)
    font_size = 170
    font_family = $heavy
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0,0,0,0.35)
}

# ---------- Glas-Karte hinter dem Login ----------
shape {
    monitor = $mon
    size = 440, 300
    color = rgba(1e1e2e66)
    rounding = 32
    border_size = 1
    border_color = rgba(cdd6f422)
    position = 0, -230
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(0,0,0,0.4)
}

# ---------- Avatar (rund, mit Verlaufsrand) ----------
image {
    monitor = $mon
    path = ~/.config/hypr/avatar.png
    size = 110
    rounding = -1
    border_size = 3
    border_color = rgba(cba6f7ee) rgba(f5c2e7ee) 45deg
    position = 0, -150
    halign = center
    valign = center
}

# ---------- Begruessung je nach Tageszeit ----------
label {
    monitor = $mon
    text = cmd[update:60000] ~/.config/hypr/scripts/lockinfo.sh greet
    color = $text
    font_size = 19
    font_family = $font SemiBold
    position = 0, -240
    halign = center
    valign = center
}

# ---------- Passwortfeld ----------
input-field {
    monitor = $mon
    size = 340, 54
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(cdd6f41a)
    inner_color = rgba(11111b55)
    font_color = $text
    font_family = $font
    check_color = rgba(cba6f7ee) rgba(89b4faee) 45deg
    fail_color = rgba(f38ba8ee) rgba(fab387ee) 45deg
    capslock_color = rgba(f9e2afee)
    placeholder_text = <span foreground="##a6adc8">Passwort eingeben ...</span>
    fail_text = <span foreground="##f38ba8"><b>Falsch</b> ($ATTEMPTS)</span>
    fade_on_empty = false
    rounding = -1
    position = 0, -310
    halign = center
    valign = center
}

# ---------- Unten links: Tastaturlayout ----------
label {
    monitor = $mon
    text = $LAYOUT
    color = $sub
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 40, 30
    halign = left
    valign = bottom
}

# ---------- Unten Mitte: gerade laeuft ----------
label {
    monitor = $mon
    text = cmd[update:2000] ~/.config/hypr/scripts/lockinfo.sh music
    color = $sub
    font_size = 13
    font_family = $font Medium
    position = 0, 30
    halign = center
    valign = bottom
}

# ---------- Unten rechts: Hinweis ----------
label {
    monitor = $mon
    text = Enter zum Entsperren
    color = rgba(a6adc888)
    font_size = 12
    font_family = $font
    position = -40, 30
    halign = right
    valign = bottom
}

# ---------- Andere Monitore: nur grosse Uhr ----------
label {
    monitor = HDMI-A-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4cc)
    font_size = 90
    font_family = $heavy
    position = 0, 0
    halign = center
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4cc)
    font_size = 90
    font_family = $heavy
    position = 0, 0
    halign = center
    valign = center
}
