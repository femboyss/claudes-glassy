# ==================================================================
#  claudes-glassy - Sperrbildschirm (hyprlock), Tokyo Night
#  hyprlock nutzt hyprlang-Syntax (nicht Lua wie Hyprland).
#  Doku: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
#                      (Schloss)
#                Sonntag, 25. Oktober
#                       00:03                 <- grosse, duenne Uhr
#                     Guten Abend
#
#                     [ Cover ]               <- nur wenn Musik laeuft
#                  Songtitel (fett)
#                     Kuenstler
#
#               ( Passwort ........ )         <- Pille unten
#   de                                      an seit 3 Std
#
#  Kein Name, kein Profilbild (Privatsphaere). Testen ohne zu sperren:
#     hyprlock --immediate-render   (oder einfach SUPER+L)
# ==================================================================

$MONITOR = DP-3
$THIN    = Inter Light
$REG     = Inter Medium
$BOLD    = Inter Bold
$FG      = rgba(c0caf5ff)
$DIM     = rgba(a9b1d6cc)
$FAINT   = rgba(565f89ff)
$SCRIPT  = ~/.config/hypr/scripts/lockinfo.sh

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 2
    fail_timeout = 1200
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 6, smooth
    animation = fadeOut, 1, 5, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 4, smooth
}

# ---------- Hintergrund: aktuelles Wallpaper, weich und abgedunkelt ----------
background {
    monitor =
    path = ~/.cache/claudes-glassy/wallpaper
    color = rgb(1a1b26)
    blur_passes = 3
    blur_size = 9
    noise = 0.012
    contrast = 0.92
    brightness = 0.45
    vibrancy = 0.22
    vibrancy_darkness = 0.15
}

# ---------- Schloss ----------
label {
    monitor = $MONITOR
    text = <span foreground="##7aa2f7">&##xf023;</span>
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 385
    halign = center
    valign = center
}

# ---------- Datum ----------
label {
    monitor = $MONITOR
    text = cmd[update:60000] $SCRIPT date
    color = $DIM
    font_size = 19
    font_family = $REG
    position = 0, 330
    halign = center
    valign = center
}

# ---------- Uhr ----------
label {
    monitor = $MONITOR
    text = cmd[update:1000] date +"%H:%M"
    color = $FG
    font_size = 124
    font_family = $THIN
    position = 0, 222
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0,0,0,0.45)
}

# ---------- Begruessung (ohne Namen) ----------
label {
    monitor = $MONITOR
    text = cmd[update:60000] $SCRIPT greet
    color = $FAINT
    font_size = 15
    font_family = $REG
    position = 0, 128
    halign = center
    valign = center
}

# ---------- Gerade laeuft: Cover ----------
image {
    monitor = $MONITOR
    path = ~/.config/hypr/lock/empty.png
    reload_time = 2
    reload_cmd = $SCRIPT cover
    size = 88
    rounding = 18
    border_size = 0
    position = 0, -10
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
}

# ---------- Gerade laeuft: Titel + Kuenstler ----------
label {
    monitor = $MONITOR
    text = cmd[update:2000] $SCRIPT title
    color = $FG
    font_size = 15
    font_family = $BOLD
    position = 0, -86
    halign = center
    valign = center
}
label {
    monitor = $MONITOR
    text = cmd[update:2000] $SCRIPT artist
    color = $DIM
    font_size = 12
    font_family = $REG
    position = 0, -110
    halign = center
    valign = center
}

# ---------- Passwort-Pille ----------
input-field {
    monitor = $MONITOR
    size = 290, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(bb9af7aa) rgba(7aa2f7aa) 45deg
    inner_color = rgba(16161ecc)
    font_color = $FG
    font_family = $REG
    check_color = rgba(7dcfffee) rgba(7aa2f7ee) 45deg
    fail_color = rgba(f7768eee) rgba(ff9e64ee) 45deg
    capslock_color = rgba(e0af68ee)
    placeholder_text = <span foreground="##565f89">Passwort</span>
    fail_text = <span foreground="##f7768e">Falsch  ($ATTEMPTS)</span>
    fade_on_empty = true
    fade_timeout = 4000
    rounding = -1
    position = 0, 120
    halign = center
    valign = bottom
}

# ---------- Unten links: Tastaturlayout ----------
label {
    monitor = $MONITOR
    text = <span foreground="##7aa2f7">&##xf11c;</span>   $LAYOUT
    color = $FAINT
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 36, 28
    halign = left
    valign = bottom
}

# ---------- Unten rechts: Laufzeit ----------
label {
    monitor = $MONITOR
    text = cmd[update:60000] $SCRIPT uptime
    color = $FAINT
    font_size = 11
    font_family = $REG
    position = -36, 28
    halign = right
    valign = bottom
}

# ---------- Andere Monitore: Uhr + Datum ----------
label {
    monitor = HDMI-A-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(c0caf5dd)
    font_size = 84
    font_family = $THIN
    position = 0, 20
    halign = center
    valign = center
}
label {
    monitor = HDMI-A-1
    text = cmd[update:60000] $SCRIPT date
    color = $FAINT
    font_size = 15
    font_family = $REG
    position = 0, -50
    halign = center
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(c0caf5dd)
    font_size = 84
    font_family = $THIN
    position = 0, 20
    halign = center
    valign = center
}
label {
    monitor = DP-1
    text = cmd[update:60000] $SCRIPT date
    color = $FAINT
    font_size = 15
    font_family = $REG
    position = 0, -50
    halign = center
    valign = center
}
