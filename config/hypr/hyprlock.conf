# Catppuccin Glass - Hyprlock
# Hinweis: hyprlock nutzt (Stand dieser Config) weiterhin hyprlang-Syntax,
# NICHT Lua wie Hyprland selbst. Doku: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$mauve = rgb(cba6f7)
$pink  = rgb(f5c2e7)
$text  = rgb(cdd6f4)
$sub   = rgb(a6adc8)
$red   = rgb(f38ba8)
$font  = Inter

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = screenshot          # aktueller Bildschirm, verschwommen = Glas-Effekt
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# Uhrzeit
label {
    monitor = DP-3
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 110
    font_family = $font Bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# Datum
label {
    monitor = DP-3
    text = cmd[update:60000] LC_TIME=de_AT.UTF-8 date +"%A, %d. %B"
    color = $sub
    font_size = 20
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

# Passwortfeld
input-field {
    monitor = DP-3
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(cba6f7cc) rgba(f5c2e7cc) 45deg
    inner_color = rgba(1e1e2e88)
    font_color = $text
    check_color = rgba(89b4facc)
    fail_color = $red
    fail_text = <i>Falsch ($ATTEMPTS)</i>
    placeholder_text = <span foreground="##a6adc8">Passwort ...</span>
    rounding = 16
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}

# Benutzer
label {
    monitor = DP-3
    text = Hallo, $USER
    color = $mauve
    font_size = 14
    font_family = $font SemiBold
    position = 0, -130
    halign = center
    valign = center
}
