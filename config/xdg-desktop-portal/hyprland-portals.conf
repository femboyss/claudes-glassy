# claudes-glassy: welche Portale unter Hyprland benutzt werden
# Bildschirm teilen / Screenshots = Hyprland, Datei-Dialoge = KDE (Dolphin-Stil)
[preferred]
default = hyprland;gtk
org.freedesktop.impl.portal.FileChooser = kde
org.freedesktop.impl.portal.ScreenCast = hyprland
org.freedesktop.impl.portal.Screenshot = hyprland
# Hell/Dunkel fuer Apps (Electron, GTK4): KDE liest das Farbschema richtig, gtk meldete "keine Vorliebe" -> Apps wurden hell
org.freedesktop.impl.portal.Settings = kde
